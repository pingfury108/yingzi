name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---- Linux musl: C 交叉工具链 (ring 含 C/汇编) ----
      - name: musl 工具链 (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
      - name: aarch64 交叉工具链 (gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }} -p yz-node

      - name: 打包 (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/yz stage/
          cp README.md docs/deploy.md stage/
          tar czf yz-${{ matrix.target }}.tar.gz -C stage .
      - name: 打包 (windows, 含 wintun.dll)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/yz.exe stage/
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll stage/
          Copy-Item README.md stage/
          New-Item -ItemType Directory -Force -Path docs | Out-Null
          Copy-Item docs/deploy.md stage/
          Compress-Archive -Path stage/* -DestinationPath yz-${{ matrix.target }}.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yz-${{ matrix.target }}
          path: |
            yz-${{ matrix.target }}.tar.gz
            yz-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS
          for d in */; do
            (cd "$d" && sha256sum * ) >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/yz-*
            dist/SHA256SUMS
