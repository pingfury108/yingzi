<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yingzi node</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d26; --fg:#e6e8ee; --dim:#8b90a0; --accent:#5b9dff; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:14px; color:var(--dim); margin:24px 0 8px; text-transform:uppercase; letter-spacing:1px; }
  .sub { color:var(--dim); font-size:12px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .grow { flex:1; }
  select, input, button { background:#10131a; color:var(--fg); border:1px solid #2a2f3e; border-radius:6px; padding:7px 10px; font-size:13px; }
  input { flex:1; min-width:200px; }
  button { cursor:pointer; border-color:var(--accent); color:var(--accent); }
  button:hover { background:var(--accent); color:#fff; }
  button.danger { border-color:#e5534b; color:#e5534b; padding:3px 8px; }
  button.danger:hover { background:#e5534b; color:#fff; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; background:#232838; color:var(--dim); }
  .badge.exit { background:rgba(62,207,142,.15); color:var(--ok); }
  .badge.self { background:rgba(91,157,255,.15); color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:6px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 4px; border-bottom:1px solid #232838; }
  th { color:var(--dim); font-weight:normal; font-size:12px; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .empty { color:var(--dim); padding:12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">yingzi</h1>
  <div class="sub" id="subtitle">loading...</div>

  <h2>默认出口</h2>
  <div class="card row">
    <select id="exitSel" class="grow"></select>
    <button onclick="saveExit()">保存</button>
    <span class="sub">当前: <b id="exitCur">-</b></span>
  </div>

  <h2>网络节点 <span class="sub" id="peerCount"></span></h2>
  <div id="nodes"></div>

  <h2>流量</h2>
  <div class="card">
    <span class="sub">发送: <b id="txB">-</b> · 接收: <b id="rxB">-</b> · 累计开流: <b id="streams">-</b> · FD: <b id="fd">-</b></span>
  </div>

  <h2>事件 <span class="sub">最近 50 条 (新→旧)</span></h2>
  <div class="card mono" id="events" style="max-height:220px;overflow:auto"></div>

  <h2>入口发布 <span class="sub">公网端口 → 组网内服务</span></h2>
  <div class="card">
    <div class="sub" style="margin-bottom:6px">我发布的 (别的节点可访问)</div>
    <table><tbody id="pub"></tbody></table><div id="pubEmpty" class="empty">无</div>
    <div class="sub" style="margin:10px 0 6px">我申请的 (公网入口节点上)</div>
    <table><tbody id="req"></tbody></table><div id="reqEmpty" class="empty">无</div>
    <div class="row" style="margin-top:10px">
      <select id="pubNode"></select>
      <input id="pubPort" placeholder="公网端口" style="max-width:110px">
      <input id="pubAddr" placeholder="本机服务, 如 127.0.0.1:80">
      <button onclick="reqIngress()">申请发布</button>
    </div>
  </div>

  <h2>分流规则 <span class="sub">按顺序匹配, 未命中走默认出口</span></h2>
  <div class="card">
    <table><thead><tr><th>规则</th><th style="width:60px"></th></tr></thead>
    <tbody id="routes"></tbody></table>
    <div id="routesEmpty" class="empty">暂无规则</div>
    <div class="row" style="margin-top:10px">
      <input id="ruleInput" placeholder="domain-suffix:google.com=vps-tokyo 或 cidr:192.168.0.0/16=nas-home">
      <button onclick="addRoute()">添加</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let TOK = localStorage.getItem('yz_token') || new URLSearchParams(location.search).get('token') || '';
if (TOK) localStorage.setItem('yz_token', TOK);
async function api(path, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, TOK ? { authorization: 'Bearer ' + TOK } : {});
  const r = await fetch(path, opt);
  if (r.status === 401) {
    const t = prompt('该节点需要访问令牌:');
    if (t) { localStorage.setItem('yz_token', t); TOK = t; location.reload(); }
    throw 401;
  }
  if (!r.ok) throw r.status;
  return (r.status === 204 || r.status === 201) ? null : r.json();
}
const short = id => id.slice(0, 8);

async function refresh() {
  try {
    const [st, ns, rs, ig, ev] = await Promise.all([
      api('/api/status'), api('/api/nodes'), api('/api/routes'), api('/api/ingress'), api('/api/events')
    ]);
    $('title').textContent = `yingzi · ${st.name}`;
    $('subtitle').textContent =
      `node_id ${short(st.node_id)} · peers ${st.peers}` + (st.socks5 ? ` · socks5 ${st.socks5}` : '');
    $('exitCur').textContent = st.default_exit;
    $('peerCount').textContent = `(${ns.length} 在线)`;
    const fmt = b => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : b > 1024 ? (b/1024).toFixed(1)+' KB' : b+' B';
    $('txB').textContent = fmt(st.traffic[0]);
    $('rxB').textContent = fmt(st.traffic[1]);
    $('streams').textContent = st.traffic[2];
    $('fd').textContent = st.fd_count;

    $('events').innerHTML = ev.length
      ? ev.map(e => {
          const t = new Date(e.ts * 1000).toLocaleTimeString();
          const c = e.level === 'warn' ? '#e5c07b' : '#8b90a0';
          return `<div style="color:${c}">${t} [${e.level}] ${e.msg}</div>`;
        }).join('')
      : '<div class="empty">暂无事件</div>';

    // ingress
    const selPub = $('pubNode');
    const keep = selPub.value;
    selPub.innerHTML = '<option value="">(选择出口节点)</option>' +
      ns.filter(n => !n.is_self).map(n => `<option value="${n.name}">${n.name}</option>`).join('');
    if (keep) selPub.value = keep;
    $('pubEmpty').style.display = ig.published.length ? 'none' : 'block';
    $('pub').innerHTML = ig.published.map(e =>
      `<tr><td class="mono">:${e.port}</td><td class="mono">→ ${e.node}:${e.addr}</td><td>${e.dynamic ? '动态' : '静态'}</td></tr>`).join('');
    $('reqEmpty').style.display = ig.requested.length ? 'none' : 'block';
    $('req').innerHTML = ig.requested.map(e =>
      `<tr><td class="mono">${e.node}:${e.port}</td><td class="mono">→ ${e.addr}</td><td>已申请</td></tr>`).join('');

    // 出口下拉: direct / auto / 可出口节点(非自己)
    const sel = $('exitSel');
    const cur = sel.value;
    sel.innerHTML = '';
    const opts = ['direct', 'auto', ...ns.filter(n => n.exit_capable && !n.is_self).map(n => n.name)];
    for (const o of opts) {
      const el = document.createElement('option');
      el.value = o; el.textContent = o;
      sel.appendChild(el);
    }
    sel.value = opts.includes(cur) ? cur : st.default_exit;

    // 节点卡片
    $('nodes').innerHTML = ns.map(n => `
      <div class="card row">
        <span class="dot"></span>
        <b>${n.name}</b>
        <span class="mono sub">${short(n.node_id)}</span>
        <span class="mono sub">${n.vip}</span>
        <span class="mono sub">${n.addr}</span>
        ${n.rtt_ms != null ? `<span class="mono sub">${n.rtt_ms} ms</span>` : ''}
        <span class="grow"></span>
        ${n.path ? `<span class="badge">${n.path}</span>` : ''}
        ${n.p2p ? '<span class="badge exit">p2p</span>' : ''}
        ${n.exit_capable ? '<span class="badge exit">exit</span>' : ''}
        ${n.is_self ? '<span class="badge self">本机</span>' : ''}
      </div>`).join('') || '<div class="empty">暂无节点</div>';

    // 规则表
    $('routesEmpty').style.display = rs.length ? 'none' : 'block';
    $('routes').innerHTML = rs.map(r => `
      <tr><td class="mono">${r.rule}</td>
      <td><button class="danger" onclick="delRoute(${r.index})">删除</button></td></tr>`).join('');
  } catch (e) { /* 节点重启中等下一次 */ }
}

async function saveExit() {
  await api('/api/exit', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ exit: $('exitSel').value }) });
  refresh();
}

async function addRoute() {
  const rule = $('ruleInput').value.trim();
  if (!rule) return;
  try {
    await api('/api/routes', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ rule }) });
    $('ruleInput').value = '';
  } catch (e) { alert('规则格式错误: ' + rule); }
  refresh();
}

async function delRoute(i) {
  await api(`/api/routes/${i}`, { method: 'DELETE' });
  refresh();
}

async function reqIngress() {
  const node = $('pubNode').value;
  const port = parseInt($('pubPort').value, 10);
  const addr = $('pubAddr').value.trim();
  if (!node || !port || !addr) { alert('选择出口节点 + 填端口和服务地址'); return; }
  try {
    await api('/api/ingress', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ node, port, addr }) });
  } catch (e) { alert('申请失败: ' + e); }
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
