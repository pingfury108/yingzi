<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yingzi node</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d26; --fg:#e6e8ee; --dim:#8b90a0; --accent:#5b9dff; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:14px; color:var(--dim); margin:24px 0 8px; text-transform:uppercase; letter-spacing:1px; }
  .sub { color:var(--dim); font-size:12px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .grow { flex:1; }
  select, input, button { background:#10131a; color:var(--fg); border:1px solid #2a2f3e; border-radius:6px; padding:7px 10px; font-size:13px; }
  input { flex:1; min-width:200px; }
  button { cursor:pointer; border-color:var(--accent); color:var(--accent); }
  button:hover { background:var(--accent); color:#fff; }
  button.danger { border-color:#e5534b; color:#e5534b; padding:3px 8px; }
  button.danger:hover { background:#e5534b; color:#fff; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; background:#232838; color:var(--dim); }
  .badge.exit { background:rgba(62,207,142,.15); color:var(--ok); }
  .badge.self { background:rgba(91,157,255,.15); color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:6px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 4px; border-bottom:1px solid #232838; }
  th { color:var(--dim); font-weight:normal; font-size:12px; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .empty { color:var(--dim); padding:12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">yingzi</h1>
  <div class="sub" id="subtitle">loading...</div>

  <h2>默认出口</h2>
  <div class="card row">
    <select id="exitSel" class="grow"></select>
    <button onclick="saveExit()">保存</button>
    <span class="sub">当前: <b id="exitCur">-</b></span>
  </div>

  <h2>网络节点 <span class="sub" id="peerCount"></span></h2>
  <div id="nodes"></div>

  <h2>分流规则 <span class="sub">按顺序匹配, 未命中走默认出口</span></h2>
  <div class="card">
    <table><thead><tr><th>规则</th><th style="width:60px"></th></tr></thead>
    <tbody id="routes"></tbody></table>
    <div id="routesEmpty" class="empty">暂无规则</div>
    <div class="row" style="margin-top:10px">
      <input id="ruleInput" placeholder="domain-suffix:google.com=vps-tokyo 或 cidr:192.168.0.0/16=nas-home">
      <button onclick="addRoute()">添加</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (p, opt) => fetch(p, opt).then(r => r.ok ? (r.status===204||r.status===201 ? null : r.json()) : Promise.reject(r.status));
const short = id => id.slice(0, 8);

async function refresh() {
  try {
    const [st, ns, rs] = await Promise.all([
      api('/api/status'), api('/api/nodes'), api('/api/routes')
    ]);
    $('title').textContent = `yingzi · ${st.name}`;
    $('subtitle').textContent =
      `node_id ${short(st.node_id)} · peers ${st.peers}` + (st.socks5 ? ` · socks5 ${st.socks5}` : '');
    $('exitCur').textContent = st.default_exit;
    $('peerCount').textContent = `(${ns.length} 在线)`;

    // 出口下拉: direct / auto / 可出口节点(非自己)
    const sel = $('exitSel');
    const cur = sel.value;
    sel.innerHTML = '';
    const opts = ['direct', 'auto', ...ns.filter(n => n.exit_capable && !n.is_self).map(n => n.name)];
    for (const o of opts) {
      const el = document.createElement('option');
      el.value = o; el.textContent = o;
      sel.appendChild(el);
    }
    sel.value = opts.includes(cur) ? cur : st.default_exit;

    // 节点卡片
    $('nodes').innerHTML = ns.map(n => `
      <div class="card row">
        <span class="dot"></span>
        <b>${n.name}</b>
        <span class="mono sub">${short(n.node_id)}</span>
        <span class="mono sub">${n.vip}</span>
        <span class="mono sub">${n.addr}</span>
        <span class="grow"></span>
        ${n.p2p ? '<span class="badge exit">p2p</span>' : ''}
        ${n.exit_capable ? '<span class="badge exit">exit</span>' : ''}
        ${n.is_self ? '<span class="badge self">本机</span>' : ''}
      </div>`).join('') || '<div class="empty">暂无节点</div>';

    // 规则表
    $('routesEmpty').style.display = rs.length ? 'none' : 'block';
    $('routes').innerHTML = rs.map(r => `
      <tr><td class="mono">${r.rule}</td>
      <td><button class="danger" onclick="delRoute(${r.index})">删除</button></td></tr>`).join('');
  } catch (e) { /* 节点重启中等下一次 */ }
}

async function saveExit() {
  await api('/api/exit', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ exit: $('exitSel').value }) });
  refresh();
}

async function addRoute() {
  const rule = $('ruleInput').value.trim();
  if (!rule) return;
  try {
    await api('/api/routes', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ rule }) });
    $('ruleInput').value = '';
  } catch (e) { alert('规则格式错误: ' + rule); }
  refresh();
}

async function delRoute(i) {
  await api(`/api/routes/${i}`, { method: 'DELETE' });
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
