<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yingzi</title>
<style>
  :root {
    --bg: #07090B;
    --surface: #0F1317;
    --surface-2: #141A1F;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.13);
    --text: #E8EEF4;
    --text-2: #93A1AF;
    --text-3: #5A6875;
    --accent: #38F0C6;
    --accent-soft: rgba(56,240,198,.10);
    --accent-line: rgba(56,240,198,.32);
    --direct: #6FE39A;
    --exit: #5FA8FF;
    --block: #FF6B7A;
    --warn: #FFC24B;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background:
      radial-gradient(1100px 700px at 15% -10%, rgba(56,240,198,.06), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(95,168,255,.05), transparent 60%),
      var(--bg);
    color: var(--text); font: 13px/1.6 var(--sans);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 60px; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .mark { width: 22px; height: 22px; }
  .brand { font: 500 13px/1 var(--mono); letter-spacing: .22em; }
  .node { font: 500 20px/1.2 var(--sans); }
  .meta { font: 400 11px/1 var(--mono); color: var(--text-3); letter-spacing: .04em; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
    font: 500 11px/1 var(--mono); letter-spacing: .06em;
    border: 1px solid var(--line); color: var(--text-3);
  }
  .pill.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--text-3); flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.ok { background: var(--direct); }
  .dot.warn { background: var(--warn); }

  /* 布局 */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .col-2 { grid-column: span 2; }
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  }
  .micro { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  h2 {
    font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--text-3); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* 控制件 */
  select, input {
    background: rgba(255,255,255,.03); color: var(--text); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 9px 12px; font: 400 12px/1 var(--mono); outline: none;
  }
  select:focus, input:focus { border-color: var(--accent-line); }
  button {
    background: var(--accent); color: #04120F; border: 0; border-radius: 10px;
    padding: 9px 16px; font: 500 12px/1 var(--sans); cursor: pointer; letter-spacing: .03em;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line-2); }
  button.ghost:hover { color: var(--text); border-color: var(--accent-line); filter: none; }
  button.danger { background: transparent; color: var(--block); border: 1px solid rgba(255,107,122,.32); padding: 5px 10px; }
  button.danger:hover { background: rgba(255,107,122,.12); filter: none; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 8px 6px; font: 500 10px/1 var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
    border-bottom: 1px solid var(--line);
  }
  td { padding: 11px 6px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .badge {
    display: inline-block; font: 500 9px/1 var(--mono); letter-spacing: .1em;
    padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--text-3);
  }
  .badge.exit { color: var(--exit); border-color: rgba(95,168,255,.3); background: rgba(95,168,255,.08); }
  .badge.self { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .badge.path { color: var(--direct); border-color: rgba(111,227,154,.3); background: rgba(111,227,154,.08); }

  .empty { color: var(--text-3); padding: 14px 4px; font-size: 12px; }
  .chart { width: 100%; height: 76px; display: block; margin-top: 10px; }
  .ev { font: 400 11px/1.7 var(--mono); color: var(--text-2); max-height: 230px; overflow: auto; }
  .ev .t { color: var(--text-3); }
  .ev .warn { color: var(--warn); }
  .ev .info { color: var(--text-2); }
  .split { display: flex; gap: 24px; flex-wrap: wrap; }
  .kv { display: flex; flex-direction: column; gap: 5px; }
  .kv b { font: 500 17px/1 var(--mono); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <svg class="mark" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9.2" stroke="#38F0C6" stroke-opacity=".22" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="5.6" stroke="#38F0C6" stroke-opacity=".55" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="2.2" fill="#38F0C6"/>
      <circle cx="12" cy="3.2" r="1.5" fill="#38F0C6" fill-opacity=".9"/>
      <circle cx="19.1" cy="16.4" r="1.5" fill="#38F0C6" fill-opacity=".55"/>
      <circle cx="4.9" cy="16.4" r="1.5" fill="#38F0C6" fill-opacity=".55"/>
    </svg>
    <span class="brand">YINGZI</span>
    <span class="node" id="nodeName">—</span>
    <span class="pill" id="statePill"><span class="dot" id="stateDot"></span><span id="stateText">连接中</span></span>
    <span class="meta" id="meta"></span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="micro">本机</div>
      <div class="split" style="margin-top:12px">
        <div class="kv"><span class="micro">虚拟 IP</span><b class="num" id="selfVip">—</b></div>
        <div class="kv"><span class="micro">对端</span><b class="num" id="peerCount">—</b></div>
      </div>
      <div class="meta" id="selfSocks" style="margin-top:12px">—</div>
    </div>

    <div class="card col-2">
      <div class="row">
        <div class="micro grow">流量（累计 / 实时）</div>
        <span class="meta" id="fdCount">FD —</span>
      </div>
      <div class="split" style="margin-top:10px">
        <div class="kv"><span class="micro">下行</span><b class="num" id="rxB" style="color:var(--accent)">—</b></div>
        <div class="kv"><span class="micro">上行</span><b class="num" id="txB" style="color:var(--exit)">—</b></div>
        <div class="kv"><span class="micro">开流</span><b class="num" id="streams">—</b></div>
        <div class="kv"><span class="micro">实时</span><b class="num" id="rate" style="color:var(--accent)">—</b></div>
      </div>
      <canvas class="chart" id="chart" width="900" height="152"></canvas>
    </div>
  </div>

  <h2>默认出口</h2>
  <div class="card row">
    <select id="exitSel" class="grow" style="max-width:280px"></select>
    <button onclick="saveExit()">应用</button>
    <span class="meta">当前 <b id="exitCur" class="num" style="color:var(--accent)">—</b></span>
  </div>

  <h2>网络节点
    <button class="ghost" style="margin-left:auto" onclick="probeAll()" id="probeBtn">一键测速</button>
  </h2>
  <div class="card" style="padding:6px 16px 10px">
    <table>
      <thead><tr>
        <th style="width:26px"></th><th>节点</th><th>虚拟 IP</th><th>地址</th>
        <th style="width:76px">RTT</th><th style="width:120px">路径</th>
      </tr></thead>
      <tbody id="nodes"></tbody>
    </table>
    <div id="nodesEmpty" class="empty">暂无节点</div>
  </div>

  <h2>分流规则 <span class="micro" style="text-transform:none;letter-spacing:0">自上而下匹配</span></h2>
  <div class="card" style="padding:6px 16px 14px">
    <table><tbody id="routes"></tbody></table>
    <div id="routesEmpty" class="empty">暂无规则（全部走默认出口）</div>
    <div class="row" style="margin-top:12px">
      <input id="ruleInput" class="grow" placeholder="domain-suffix:google.com=vps-tokyo 或 cidr:192.168.0.0/16=nas-home">
      <button onclick="addRoute()">添加</button>
    </div>
  </div>

  <h2>入口发布 <span class="micro" style="text-transform:none;letter-spacing:0">公网端口 → 组网内服务</span></h2>
  <div class="card">
    <div class="micro">我发布的</div>
    <table><tbody id="pub"></tbody></table>
    <div id="pubEmpty" class="empty">无</div>
    <div class="micro" style="margin:16px 0 8px">我申请的</div>
    <table><tbody id="req"></tbody></table>
    <div id="reqEmpty" class="empty">无</div>
    <div class="row" style="margin-top:14px">
      <select id="pubNode" style="max-width:180px"></select>
      <input id="pubPort" placeholder="公网端口" style="max-width:120px">
      <input id="pubAddr" class="grow" placeholder="本机服务，如 127.0.0.1:80">
      <button onclick="reqIngress()">申请发布</button>
    </div>
  </div>

  <h2>事件 <span class="micro" style="text-transform:none;letter-spacing:0">最近 50 条 · 新→旧</span></h2>
  <div class="card ev" id="events"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let TOK = localStorage.getItem('yz_token') || new URLSearchParams(location.search).get('token') || '';
if (TOK) localStorage.setItem('yz_token', TOK);

async function api(path, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, TOK ? { authorization: 'Bearer ' + TOK } : {});
  const r = await fetch(path, opt);
  if (r.status === 401) {
    const t = prompt('该节点需要访问令牌:');
    if (t) { localStorage.setItem('yz_token', t); TOK = t; location.reload(); }
    throw 401;
  }
  if (!r.ok) throw r.status;
  return (r.status === 204 || r.status === 201) ? null : r.json();
}
const short = id => (id || '').slice(0, 8);
const fmt = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB'
  : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB'
  : b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b + ' B';

// 速率曲线（客户端采样）
const series = { down: [], up: [] };
let last = null;
function pushSample(rx, tx) {
  const now = Date.now();
  if (last && now > last.t) {
    const dt = (now - last.t) / 1000;
    series.down.push((rx - last.rx) / dt);
    series.up.push((tx - last.tx) / dt);
    while (series.down.length > 90) series.down.shift();
    while (series.up.length > 90) series.up.shift();
    $('rate').textContent = fmt(Math.round(series.down.at(-1))) + '/s';
  }
  last = { t: now, rx, tx };
  drawChart();
}

function drawChart() {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr)) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const n = series.down.length;
  if (n < 2) return;
  const max = Math.max(...series.down, ...series.up, 1) * 1.15;
  const path = (arr, color, fill) => {
    g.beginPath();
    arr.forEach((v, i) => {
      const x = (i / (arr.length - 1)) * w;
      const y = h - 6 - (v / max) * (h - 12);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.strokeStyle = color; g.lineWidth = 1.5; g.stroke();
    if (fill) {
      g.lineTo(w, h); g.lineTo(0, h); g.closePath();
      const grad = g.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, color.replace(')', ',.22)').replace('rgb', 'rgba'));
      grad.addColorStop(1, color.replace(')', ',0)').replace('rgb', 'rgba'));
      g.fillStyle = grad; g.fill();
    }
  };
  path(series.up, 'rgb(95,168,255)', false);
  path(series.down, 'rgb(56,240,198)', true);
}

async function refresh() {
  try {
    const [st, ns, rs, ig, ev] = await Promise.all([
      api('/api/status'), api('/api/nodes'), api('/api/routes'), api('/api/ingress'), api('/api/events')
    ]);

    $('nodeName').textContent = st.name || '—';
    const selfNode = ns.find(n => n.is_self) || {};
    $('meta').textContent = `node_id ${short(st.node_id)}`;
    const online = (st.peers || 0) > 0;
    $('stateDot').className = 'dot' + (online ? ' on' : '');
    $('statePill').className = 'pill' + (online ? ' on' : '');
    $('stateText').textContent = online ? '已连接' : '等待协调器';

    $('selfVip').textContent = selfNode.vip || '—';
    $('peerCount').textContent = st.peers ?? '—';
    $('selfSocks').textContent = st.socks5 ? `SOCKS5 ${st.socks5}` : '未启用 SOCKS5';

    $('txB').textContent = fmt(st.traffic[0]);
    $('rxB').textContent = fmt(st.traffic[1]);
    $('streams').textContent = st.traffic[2];
    $('fdCount').textContent = `FD ${st.fd_count}`;
    pushSample(st.traffic[1], st.traffic[0]);

    $('exitCur').textContent = st.default_exit;

    // 节点
    $('nodesEmpty').style.display = ns.length ? 'none' : 'block';
    $('nodes').innerHTML = ns.map(n => {
      const connected = !!n.path;                      // 有路径 = 隧道已建立
      const dotCls = n.is_self ? 'dot on' : connected ? 'dot ok'
        : (n.exit_capable ? 'dot warn' : 'dot');
      const pr = probeResult[n.name] || {};
      const rttVal = pr.rtt_ms || n.rtt_ms;
      const rtt = rttVal === 0 && connected ? '<1ms' : rttVal ? `${rttVal}ms` : '—';
      const rttColor = (!connected && !rttVal) ? 'var(--text-3)'
        : ((rttVal ?? 0) <= 20 ? 'var(--direct)' : (rttVal ?? 0) <= 120 ? 'var(--text-2)' : 'var(--warn)');
      return `<tr>
        <td><span class="${dotCls}"></span></td>
        <td>
          <div class="row" style="gap:7px">
            <span class="mono" style="color:var(--text)">${n.name}</span>
            ${n.is_self ? '<span class="badge self">本机</span>' : ''}
            ${n.exit_capable ? '<span class="badge exit">出口</span>' : ''}
            ${n.p2p ? '<span class="badge path">p2p</span>' : ''}
          </div>
          <div class="meta" style="margin-top:4px">${short(n.node_id)}</div>
        </td>
        <td class="mono" style="color:var(--text-2)">${n.vip || '—'}</td>
        <td class="mono" style="color:var(--text-3)" title="${(n.addrs || []).join('\n')}">${n.addr || '—'}</td>
        <td class="mono" style="color:${rttColor}">${rtt || '—'}</td>
        <td>${n.is_self ? '<span class="badge self">本机</span>'
          : n.path ? `<span class="badge path">${n.path}</span>`
          : '<span class="meta">在线 · 未建隧道</span>'}</td>
      </tr>`;
    }).join('');

    // 出口下拉
    const sel = $('exitSel');
    const cur = sel.value;
    const opts = ['direct', 'auto', ...ns.filter(n => n.exit_capable && !n.is_self).map(n => n.name)];
    sel.innerHTML = opts.map(o => `<option value="${o}">${o}</option>`).join('');
    sel.value = opts.includes(cur) ? cur : st.default_exit;

    // 规则
    $('routesEmpty').style.display = rs.length ? 'none' : 'block';
    $('routes').innerHTML = rs.map(r => `<tr>
      <td class="mono">${r.rule}</td>
      <td style="text-align:right"><button class="danger" onclick="delRoute(${r.index})">删除</button></td>
    </tr>`).join('');

    // 入口
    const selPub = $('pubNode');
    const keep = selPub.value;
    selPub.innerHTML = '<option value="">(选择出口节点)</option>' +
      ns.filter(n => !n.is_self).map(n => `<option value="${n.name}">${n.name}</option>`).join('');
    if (keep) selPub.value = keep;
    $('pubEmpty').style.display = ig.published.length ? 'none' : 'block';
    $('pub').innerHTML = ig.published.map(e => `<tr>
      <td class="mono">:${e.port}</td>
      <td class="mono" style="color:var(--text-3)">→ ${e.node}:${e.addr}</td>
      <td class="meta" style="text-align:right">${e.dynamic ? '动态' : '静态'}</td>
    </tr>`).join('');
    $('reqEmpty').style.display = ig.requested.length ? 'none' : 'block';
    $('req').innerHTML = ig.requested.map(e => `<tr>
      <td class="mono">${e.node}:${e.port}</td>
      <td class="mono" style="color:var(--text-3)">→ ${e.addr}</td>
      <td class="meta" style="text-align:right">已申请</td>
    </tr>`).join('');

    // 事件
    $('events').innerHTML = ev.length ? ev.map(e => {
      const t = new Date(e.ts * 1000).toLocaleTimeString();
      const cls = e.level === 'warn' ? 'warn' : 'info';
      return `<div><span class="t">${t}</span> <span class="${cls}">[${e.level}] ${e.msg}</span></div>`;
    }).join('') : '<div class="empty">暂无事件</div>';
  } catch (e) { /* 节点重启中，等下一次 */ }
}

async function probeAll() {
  const btn = $('probeBtn');
  btn.disabled = true; btn.textContent = '测速中…';
  try {
    const res = await api('/api/probe', { method: 'POST' });
    probeResult = Object.fromEntries((res || []).map(r => [r.name, r]));
  } catch (e) { /* ignore */ }
  btn.disabled = false; btn.textContent = '一键测速';
  refresh();
}
let probeResult = {};

async function saveExit() {
  await api('/api/exit', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ exit: $('exitSel').value })
  });
  refresh();
}
async function addRoute() {
  const rule = $('ruleInput').value.trim();
  if (!rule) return;
  try {
    await api('/api/routes', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ rule })
    });
    $('ruleInput').value = '';
  } catch (e) { alert('规则格式错误: ' + rule); }
  refresh();
}
async function delRoute(i) {
  await api(`/api/routes/${i}`, { method: 'DELETE' });
  refresh();
}
async function reqIngress() {
  const node = $('pubNode').value;
  const port = parseInt($('pubPort').value, 10);
  const addr = $('pubAddr').value.trim();
  if (!node || !port || !addr) { alert('选择出口节点 + 填端口和服务地址'); return; }
  try {
    await api('/api/ingress', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ node, port, addr })
    });
  } catch (e) { alert('申请失败: ' + e); }
  refresh();
}

refresh();
setInterval(refresh, 2000);
window.addEventListener('resize', drawChart);
</script>
</body>
</html>
