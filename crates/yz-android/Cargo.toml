[package]
name = "yz-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "yz_android"
crate-type = ["cdylib"]

[dependencies]
yz-core = { path = "../yz-core" }
yz-proto = { path = "../yz-proto" }
yz-crypto = { path = "../yz-crypto" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
log = "0.4"
android_logger = "0.14"
futures = "0.3"
